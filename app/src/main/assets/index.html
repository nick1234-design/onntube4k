<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
*{box-sizing:border-box}body{margin:0;background:#0f0f0f;color:#fff;font:18px Arial,sans-serif}header{padding:28px 5vw 18px;display:flex;align-items:center;gap:24px}h1{font-size:30px;margin:0;color:#ff3434}form{display:flex;gap:10px;flex:1;max-width:900px}input{background:#222;color:white;border:1px solid #555;border-radius:8px;padding:15px 18px;font-size:20px;flex:1;min-width:100px}button{background:#ff3030;color:white;border:0;border-radius:8px;padding:14px 24px;font-size:19px;font-weight:bold;cursor:pointer}button:focus,input:focus,.video:focus{outline:4px solid #fff;outline-offset:3px}main{padding:10px 5vw 40px}#status{color:#bbb;margin:12px 0 20px}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:24px}.video{background:#1c1c1c;border-radius:10px;overflow:hidden;cursor:pointer;border:3px solid transparent}.video img{width:100%;aspect-ratio:16/9;object-fit:cover;display:block}.info{padding:12px}.title{font-size:17px;font-weight:bold;line-height:1.3}.channel{font-size:14px;color:#aaa;margin-top:8px}#player{position:fixed;inset:0;background:#000;display:none;z-index:5;align-items:center;justify-content:center;flex-direction:column}#player iframe{width:88vw;height:78vh;border:0}#close{position:absolute;top:22px;right:30px;z-index:6;background:#333}#error{color:#ff8888}@media(max-width:900px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style></head><body>
<header><h1>▶ OnnTube4K</h1><form onsubmit="event.preventDefault();search()"><input id="q" type="search" placeholder="Search YouTube videos" aria-label="Search YouTube videos"><button type="submit">Search</button></form></header>
<main><div id="status">Search for a video to get started.</div><div id="error"></div><section class="grid" id="results"></section></main>
<div id="player"><button id="close" onclick="closePlayer()">Back ✕</button><div id="frame"></div></div>
<script>
const q=document.getElementById('q');function search(){const value=q.value.trim();if(!value)return;document.getElementById('status').textContent='Searching YouTube…';document.getElementById('error').textContent='';document.getElementById('results').innerHTML='';AndroidTube.search(value)}
function showResults(raw){const data=JSON.parse(raw);document.getElementById('status').textContent=data.length?data.length+' results':'No videos found.';document.getElementById('results').innerHTML='';data.forEach(v=>{const card=document.createElement('div');card.className='video';card.tabIndex=0;card.innerHTML='<img alt=""><div class="info"><div class="title"></div><div class="channel"></div></div>';card.querySelector('img').src=v.thumbnail;card.querySelector('.title').textContent=v.title;card.querySelector('.channel').textContent=v.channel;card.onclick=()=>play(v.id);card.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();play(v.id)}};document.getElementById('results').appendChild(card)})}
function showError(message){document.getElementById('status').textContent='Search unavailable';document.getElementById('error').textContent=message}
function play(id){document.getElementById('player').style.display='flex';document.getElementById('frame').innerHTML='<iframe src="https://www.youtube.com/embed/'+encodeURIComponent(id)+'?autoplay=1&playsinline=1&enablejsapi=1&origin=https://www.youtube.com" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen title="YouTube video player"></iframe>';AndroidTube.setPlayerOpen(true);document.getElementById('close').focus()}
function closePlayer(){document.getElementById('player').style.display='none';document.getElementById('frame').innerHTML='';AndroidTube.setPlayerOpen(false)}
q.addEventListener('keydown',e=>{if(e.key==='Enter')search()});
</script></body></html>
